# 号源 QueueDepth · 患者端 / 分诊台 H5 镜像（S14）
#
# 触发：
#   - push tag `v*`        → 构建并推送 ghcr.io/xcqj/appt-h5
#   - workflow_dispatch    → 默认只构建（push=false），需要推送时勾选
#
# 只构建 H5（小程序包需要真实 AppID 与开发者工具）；接口前缀固定 /dev-api，
# 后端地址由运行时 APPT_API_UPSTREAM 注入（见 Dockerfile）。
name: image-h5

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      push:
        description: '推送镜像到 ghcr.io'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login ghcr.io
        if: github.event_name == 'push' || github.event.inputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/xcqj/appt-h5
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            VITE_APP_BASE_API=/dev-api
          push: ${{ github.event_name == 'push' || github.event.inputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
